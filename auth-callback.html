<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在确认…</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 420px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #44403c;
      background: #f5f5f4;
      line-height: 1.6;
      font-size: 0.9375rem;
    }
    .err { color: #b91c1c; }
    code { font-size: 0.8125rem; }
  </style>
</head>
<body>
  <p id="msg">正在完成邮箱确认…</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://tteagpayufnbxbvynceu.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_0QMAiTeU7KOBMvoJgo1ZDg_ERG9r6IJ";

    const msg = document.getElementById("msg");

    (async function () {
      if (typeof supabase === "undefined" || !supabase.createClient) {
        msg.textContent = "无法加载 Supabase 脚本。";
        msg.className = "err";
        return;
      }
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const authUrl = new URL(window.location.href);
      const qErr = authUrl.searchParams.get("error");
      const qErrDesc = authUrl.searchParams.get("error_description");
      if (qErr) {
        const detail = qErrDesc
          ? decodeURIComponent(qErrDesc.replace(/\+/g, " "))
          : qErr;
        msg.className = "err";
        msg.textContent = "链接无效：" + detail + " 请回到 login.html 重试。";
        return;
      }
      if (!authUrl.searchParams.get("code")) {
        msg.textContent = "缺少确认参数。请从邮箱里的确认链接打开本页，或打开 login.html 登录。";
        return;
      }
      const { error } = await client.auth.exchangeCodeForSession(window.location.href);
      if (error) {
        msg.className = "err";
        msg.textContent =
          "确认失败：" +
          (error.message || String(error)) +
          " 请在 Supabase → Authentication → URL Configuration → Redirect URLs 中添加本页完整地址，例如 ";
        msg.appendChild(document.createElement("br"));
        const c = document.createElement("code");
        c.textContent = window.location.origin + window.location.pathname;
        msg.appendChild(c);
        return;
      }
      window.location.replace("notes.html");
    })();
  </script>
</body>
</html>
