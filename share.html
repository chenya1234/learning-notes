<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分享笔记</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 560px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
      background: #f5f5f4;
      line-height: 1.5;
    }
    .container {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #1a1a1a;
    }
    .loading, .not-found {
      text-align: center;
      padding: 3rem 1rem;
      color: #57534e;
    }
    .not-found {
      color: #b91c1c;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .tag-chip {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 500;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #e0e7ff;
      color: #3730a3;
    }
    .tag-chip.muted {
      background: #f5f5f4;
      color: #78716c;
      font-weight: 400;
    }
    time {
      display: block;
      font-size: 0.8125rem;
      color: #78716c;
      margin-bottom: 0.75rem;
    }
    .note-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1rem;
      line-height: 1.6;
      color: #374151;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      text-decoration: none;
    }
    .back-link:hover {
      background: #dbeafe;
    }
    .share-hint {
      font-size: 0.75rem;
      color: #78716c;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid #e7e5e4;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">加载中…</div>
  <div class="container" id="content" hidden>
    <h1>分享的笔记</h1>
    <div class="tag-row" id="tags"></div>
    <time id="time"></time>
    <div class="note-content" id="text"></div>
    <a href="notes.html" class="back-link">返回笔记列表</a>
    <p class="share-hint">这是一条公开分享的笔记，任何人都可以通过链接查看。</p>
  </div>
  <div class="not-found" id="not-found" hidden>
    <p>未找到该笔记或分享链接已失效</p>
    <p id="error-detail" style="font-size: 0.875rem; color: #78716c; margin-top: 0.5rem;"></p>
    <a href="notes.html" class="back-link" style="margin-top: 1rem;">返回首页</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://tteagpayufnbxbvynceu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0QMAiTeU7KOBMvoJgo1ZDg_ERG9r6IJ";

    const loadingEl = document.getElementById("loading");
    const contentEl = document.getElementById("content");
    const notFoundEl = document.getElementById("not-found");
    const errorDetailEl = document.getElementById("error-detail");
    const tagsEl = document.getElementById("tags");
    const timeEl = document.getElementById("time");
    const textEl = document.getElementById("text");

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    async function loadNote() {
      const url = new URL(window.location.href);
      const token = url.searchParams.get("token");
      
      if (!token) {
        loadingEl.hidden = true;
        notFoundEl.hidden = false;
        errorDetailEl.textContent = "缺少分享 token 参数";
        return;
      }

      try {
        loadingEl.textContent = "正在连接数据库…";
        const { data, error, count } = await supabaseClient
          .from("learning_notes")
          .select("created_at, text, tags", { count: 'exact' })
          .eq("share_token", token)
          .limit(1);

        console.log("Query result:", { data, error, count });

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          loadingEl.hidden = true;
          notFoundEl.hidden = false;
          errorDetailEl.textContent = "数据库中未找到匹配的笔记。token: " + token + "，查询返回: " + (count || 0) + " 条记录。请检查数据库中 learning_notes 表的 share_token 字段是否已正确保存。";
          return;
        }

        const note = data[0];

        const tags = Array.isArray(note.tags) ? note.tags.slice().sort() : [];
        if (tags.length) {
          tags.forEach(function (t) {
            const chip = document.createElement("span");
            chip.className = "tag-chip";
            chip.textContent = t;
            tagsEl.appendChild(chip);
          });
        } else {
          const chip = document.createElement("span");
          chip.className = "tag-chip muted";
          chip.textContent = "无标签";
          tagsEl.appendChild(chip);
        }

        timeEl.dateTime = note.created_at;
        timeEl.textContent = formatTime(note.created_at);
        textEl.textContent = note.text;

        loadingEl.hidden = true;
        contentEl.hidden = false;
      } catch (err) {
        console.error("Error:", err);
        loadingEl.hidden = true;
        notFoundEl.hidden = false;
        errorDetailEl.textContent = "错误详情: " + (err.message || String(err));
      }
    }

    loadNote();
  </script>
</body>
</html>
